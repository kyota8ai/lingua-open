<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="lingua-open">
  <!--
    No rounded-square plate here, unlike the app icons. A tab already provides
    the container, so dropping the plate gives the mark about 40% more area and
    keeps the three bars separable down to 16px, where the plated version
    turns to mush.

    The fills are the light and dark `primary` from the generated theme, so a
    reseed should update them too.
  -->
  <style>
    path { fill: #116682 }
    @media (prefers-color-scheme: dark) { path { fill: #8bd0ef } }
  </style>
  <g transform="scale(1.2) translate(-2 -2)">
