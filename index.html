<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Practice speaking any language with AI. Your conversations never touch our servers, because we don't have any. Free with your own API key, open source."
    />
    <title>lingua-open · Speak freely. Literally.</title>
    <!-- Matches the app canvas in each theme, so the browser chrome blends into the page. -->
    <meta name="theme-color" content="#f6fafd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1417" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("lingua-theme");
        } catch (e) {}
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
